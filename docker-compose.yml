version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: finops-postgres-compose
    environment:
      POSTGRES_USER: finops_user
      POSTGRES_PASSWORD: finops_password
      POSTGRES_DB: finops_db
    ports:
      - "5432:5432"
    volumes:
      - ./data:/data
      - ./db/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops_user -d finops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml_engine:
    build: .
    container_name: finops-ml-engine
    environment:
      - DB_HOST=db
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
